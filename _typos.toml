[default.extend-words]
# Deliberate misspellings in examples and test fixtures.
teh = "teh"
tha = "tha"
# Vim's :enew.
enew = "enew"
# The noice.nvim plugin.
noice = "noice"

[files]
# Vendored web fonts; the unicode-range values look like words.
# Annotation events store anchor context cut off mid-word.
extend-exclude = ["site/fonts/", ".annox/"]
