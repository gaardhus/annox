# Git hooks, run by prek (https://prek.j178.dev). Install with `just hooks`.
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
# Hooks without their own `stages` run only before a commit, not on the message.
default_stages = ["pre-commit", "manual"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "https://github.com/crate-ci/committed"
rev = "v1.1.11"
hooks = [{ id = "committed" }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.3"
# Report only: many misspellings here are deliberate test fixtures.
hooks = [{ id = "typos", args = ["--force-exclude"] }]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.77"
hooks = [{ id = "rumdl-check", args = ["--fix"] }]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "https://github.com/JohnnyMorganz/StyLua"
rev = "v2.5.2"
hooks = [{ id = "stylua-github" }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all"
language = "system"
types = ["rust"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "cargo clippy --workspace --all-targets --locked -- -D warnings"
language = "system"
types = ["rust"]
pass_filenames = false
stages = ["pre-push", "manual"]
