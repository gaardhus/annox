# Changelog and release notes, rendered by release-plz with git-cliff.
# Groups are ordered by the HTML comment in their name, which the template strips.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]
"""
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}\
  {% if commit.breaking and commit.breaking_description != commit.message %}: {{ commit.breaking_description }}{% endif %}\
  {% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ remote.link }}/pull/{{ commit.remote.pr_number }})){% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
# Keep breaking changes even if their type is otherwise skipped, e.g. `refactor!:`.
protect_breaking_commits = true
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^refactor", group = "<!-- 5 -->Changed" },
  { message = "^(style|test|ci|build|chore)", skip = true },
  { message = ".*", group = "<!-- 6 -->Other" },
]
sort_commits = "oldest"
