# Commit message rules, checked by the commit-msg hook and in CI.
# See https://www.conventionalcommits.org/
style = "conventional"
allowed_types = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
subject_length = 72
subject_capitalized = false
merge_commit = false
