<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 128" width="400" height="128" role="img" aria-label="annox">
  <style>
    .name { fill: #1f2937; }
    @media (prefers-color-scheme: dark) { .name { fill: #f3f4f6; } }
  </style>
  <!-- Icon, same as annox.svg -->
  <!-- White halo keeps the dark outline visible on dark backgrounds -->
  <path d="M26 10 h44 l20 20 v74 a10 10 0 0 1 -10 10 h-54 a10 10 0 0 1 -10 -10 v-84 a10 10 0 0 1 10 -10 z"
        fill="#ffffff" stroke="#ffffff" stroke-width="11" stroke-linejoin="round"/>
  <!-- Document with folded corner -->
  <path d="M26 10 h44 l20 20 v74 a10 10 0 0 1 -10 10 h-54 a10 10 0 0 1 -10 -10 v-84 a10 10 0 0 1 10 -10 z"
        fill="#ffffff" stroke="#1f2937" stroke-width="5" stroke-linejoin="round"/>
  <path d="M70 10 v12 a8 8 0 0 0 8 8 h12" fill="none" stroke="#1f2937" stroke-width="5" stroke-linejoin="round"/>
  <!-- Highlighted span -->
  <rect x="25" y="82" width="54" height="16" rx="4" fill="#facc15"/>
  <!-- Text lines -->
  <g stroke="#9ca3af" stroke-width="5" stroke-linecap="round">
    <line x1="31" y1="33" x2="58" y2="33"/>
    <line x1="31" y1="50" x2="54" y2="50"/>
    <line x1="31" y1="67" x2="54" y2="67"/>
    <line x1="31" y1="90" x2="73" y2="90" stroke="#1f2937"/>
  </g>
  <!-- Comment bubble, tail curving down to the highlight -->
  <path d="M74 38 H108 a10 10 0 0 1 10 10 v12 a10 10 0 0 1 -10 10 H90 Q82 72 71 78 Q75 74 76 70 H74 a10 10 0 0 1 -10 -10 v-12 a10 10 0 0 1 10 -10 z"
        fill="#ffffff" stroke="#ffffff" stroke-width="11" stroke-linejoin="round"/>
  <path d="M74 38 H108 a10 10 0 0 1 10 10 v12 a10 10 0 0 1 -10 10 H90 Q82 72 71 78 Q75 74 76 70 H74 a10 10 0 0 1 -10 -10 v-12 a10 10 0 0 1 10 -10 z"
        fill="#6366f1" stroke="#1f2937" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#ffffff">
    <circle cx="79" cy="54" r="4"/>
    <circle cx="91" cy="54" r="4"/>
    <circle cx="103" cy="54" r="4"/>
  </g>
  <!-- Name -->
  <text class="name" x="142" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="84" font-weight="700" letter-spacing="-2">annox</text>
</svg>
