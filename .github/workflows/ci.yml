name: CI

on:
  pull_request:
  # Pushes to main run CI from release.yml, so a release waits for it.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: j178/prek-action@v3.0.0

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: crate-ci/committed@v1.1.11

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test --workspace --locked

  # Runs install.ps1 against the latest release, in both Windows PowerShell and PowerShell 7.
  install-windows:
    name: install.ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install
        run: ./install.ps1 -Dir "$env:RUNNER_TEMP\bin" -Skill -SkillDir "$env:RUNNER_TEMP\skills" -NoModifyPath
      - name: Reinstall over the running binary
        run: |
          # A hub runs until stopped, which keeps annox.exe locked during the reinstall.
          $hub = Start-Process "$env:RUNNER_TEMP\bin\annox.exe" -ArgumentList 'hub', '--data', "$env:RUNNER_TEMP\hub" -PassThru
          try { ./install.ps1 -Dir "$env:RUNNER_TEMP\bin" -NoModifyPath } finally { Stop-Process $hub }
      - name: Check
        run: |
          & "$env:RUNNER_TEMP\bin\annox.exe" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP\skills\annox\SKILL.md")) { throw 'skill not installed' }
      - name: Install through irm | iex, adding to PATH
        run: |
          $env:ANNOX_INSTALL_DIR = "$env:RUNNER_TEMP\iex"
          $env:ANNOX_SKILL = '1'
          Get-Content -Raw ./install.ps1 | Invoke-Expression
          annox --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($d in '.claude', '.agents') {
            if (-not (Test-Path "$HOME\$d\skills\annox\SKILL.md")) { throw "skill not installed in ~\$d\skills" }
          }

  nvim:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release, and the latest.
        neovim: [v0.11.0, stable]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: cargo build -p annox-lsp --locked
      - name: Run plugin tests
        env:
          ANNOX_BIN: ${{ github.workspace }}/target/debug/annox
        run: |
          for t in editors/nvim/tests/*.lua; do
            echo "::group::$t"
            nvim --headless --clean -l "$t"
            echo "::endgroup::"
          done

  vscode:
    name: VS Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: cargo build -p annox-lsp --locked
      - name: Run extension tests
        env:
          ANNOX_BIN: ${{ github.workspace }}/target/debug/annox
        run: xvfb-run -a npm run test:e2e
