name: Release

# Every push to main updates a release PR that bumps the version and the
# changelog (git-cliff, cliff.toml). Merging it tags `vX.Y.Z`, creates the
# GitHub release, and attaches binaries, once CI passes.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Release the version in Cargo.toml if it has no tag yet.
  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released"
            exit 0
          fi
          # The notes are the version's section of CHANGELOG.md, as merged.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on
          ' CHANGELOG.md > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Open or update the release PR, if there are changes worth releasing.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: git-cliff@2.14.2
      - id: next
        run: |
          current="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          # The latest tag if nothing since it bumps the version (e.g. only `ci:` commits).
          next=$(git cliff --bumped-version)
          if [ "$next" = "$current" ]; then
            echo "Nothing to release since $current"
            exit 0
          fi
          sed -i "0,/^version = \".*\"$/s//version = \"${next#v}\"/" Cargo.toml
          cargo update --workspace
          git cliff --unreleased --tag "$next" --strip header -o section.md
          python3 - <<'EOF'
          from pathlib import Path
          changelog = Path("CHANGELOG.md")
          marker = "## [Unreleased]\n"
          head, rest = changelog.read_text().split(marker, 1)
          section = Path("section.md").read_text().strip()
          changelog.write_text(f"{head}{marker}\n{section}\n\n{rest.lstrip()}")
          EOF
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - if: steps.next.outputs.tag != ''
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: release
          title: "chore: release ${{ steps.next.outputs.tag }}"
          commit-message: "chore: release ${{ steps.next.outputs.tag }}"
          body-path: section.md
          add-paths: |
            Cargo.toml
            Cargo.lock
            CHANGELOG.md

  # Attach `annox` binaries to the release.
  binaries:
    name: Binary (${{ matrix.target }})
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p annox-lsp --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="annox-$TAG-$TARGET"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          # The agent skill, which install.sh --skill installs.
          mkdir "$name/skills"
          cp -R skills/annox "$name/skills/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/annox.exe" "$name/"
            7z a "$name.zip" "$name"
            asset="$name.zip"
          else
            cp "target/$TARGET/release/annox" "$name/"
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          gh release upload "$TAG" "$asset" --clobber

  # Checksums of every archive, which install.sh verifies against.
  checksums:
    name: Checksums
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'annox-*' --dir dist
          cd dist
          sha256sum annox-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
