# Releases, run by release-plz (https://release-plz.dev) from .github/workflows/release.yml.
# Versions come from git tags; nothing is published to crates.io.
[workspace]
git_only = true
changelog_config = "cliff.toml"
changelog_update = false
git_release_enable = false

[[package]]
name = "annox-core"
version_group = "annox"

[[package]]
name = "annox-sync"
version_group = "annox"

# The `annox` binary. Its changelog and GitHub release cover the whole workspace.
[[package]]
name = "annox-lsp"
version_group = "annox"
git_tag_name = "v{{ version }}"
git_release_enable = true
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["annox-core", "annox-sync"]
